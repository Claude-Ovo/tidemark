<!doctype html>
<!-- P0-11 v2 原型（开工门第二步，三审修订）：真实 /viz/ocean 快照 → 记忆潮池一屏。
     零 React 零依赖；dev 走 vite 代理注入 viz key，production 由 CloudFront origin header
     贴 viz key（浏览器零凭证语义两端一致）。本页已进 vite build input（check-dist.mjs 把门）。
     ?script=1 播放 scripted 因果序列（明示 SCRIPTED，只演动态语法；真实动画只认 /viz/activity）。
     三审动效修订：remember 真生成并留存粒子（走正常 layout target）；per-particle
     presentation radius（迁移持久、从当前呈现值可中断 retarget，不回跳）；credited 完整
     潮痕环 / blamed 断裂侵蚀环（全页唯一 signature）；prefers-reduced-motion 直落终态；
     rAF 只在有活跃动画时调度。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidemark · 记忆潮池</title>
<style>
  html, body { margin: 0; height: 100%; background: #07090c; color: #b8c7d9;
    font: 13px/1.5 system-ui, sans-serif; }
  #stage { display: block; width: 100vw; height: 100vh; }
  /* 三审 P1-2：thesis 是首屏唯一解释文字；技术元数据降为暗色小字 */
  #hud { position: fixed; left: 16px; top: 14px; right: 16px; user-select: none; pointer-events: none; }
  #hud .thesis { font-size: 15px; font-weight: 600; color: #dfe9f5; letter-spacing: .05em; }
  #hud .meta { opacity: .32; font-size: 11px; margin-top: 3px; }
  #hud .script { color: #8fb8e8; font-size: 12px; margin-top: 8px; min-height: 1.2em; }
  /* 三审 P1-3：层名移出 canvas——固定 legend（结构编码），不与数据粒子争位 */
  #legend { position: fixed; left: 16px; bottom: 14px; user-select: none; pointer-events: none;
    font-size: 11px; line-height: 1.9; opacity: .62; }
  #legend .row { display: flex; align-items: center; gap: 8px; }
  #legend .swatch { width: 18px; height: 0; border-top: 1px solid rgba(140,170,205,.7); }
  #legend .swatch.dash { border-top-style: dashed; }
  #legend .dir { opacity: .6; margin-top: 2px; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #d98c8c; }
  /* hover 固定卡：不跟鼠标（GPT 稿采纳项），120-180ms 延迟出现 */
  #hovercard { position: fixed; right: 16px; top: 64px; width: 260px; padding: 10px 12px;
    background: rgba(13,18,24,.92); border: 1px solid #223042; border-radius: 6px;
    font-size: 12px; line-height: 1.6; display: none; pointer-events: none; z-index: 5; }
  #hovercard .k { opacity: .5; margin-right: 6px; }
  #hovercard .preview { margin-top: 6px; opacity: .8; }
  /* 右侧抽屉：detail 真源；reduced-motion 下无过渡 */
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 92vw);
    background: #0b0f14; border-left: 1px solid #223042; padding: 18px 20px;
    transform: translateX(105%); transition: transform .28s ease; overflow-y: auto;
    z-index: 10; font-size: 13px; line-height: 1.65; }
  #drawer.open { transform: translateX(0); }
  @media (prefers-reduced-motion: reduce) { #drawer { transition: none; } }
  #drawer h2 { font-size: 13px; margin: 0 0 4px; color: #dfe9f5; }
  #drawer .meta { font-size: 11px; opacity: .5; margin-bottom: 12px; }
  #drawer .content { white-space: pre-wrap; background: rgba(140,170,205,.05);
    padding: 10px; border-radius: 4px; margin-bottom: 4px; }
  #drawer .scope { font-size: 11px; opacity: .45; margin-bottom: 12px; }
  #drawer .sec { font-size: 11px; letter-spacing: .1em; opacity: .5; margin: 14px 0 6px; }
  #drawer .attr { padding: 6px 0; border-top: 1px solid rgba(140,170,205,.08); font-size: 12px; }
  #drawer .attr .amt { float: right; opacity: .7; }
  #drawer button.close { position: absolute; top: 12px; right: 14px; background: none;
    border: 1px solid #2c3a4c; color: #b8c7d9; border-radius: 4px; padding: 2px 10px; cursor: pointer; }
  #curve { width: 100%; height: 72px; margin: 4px 0; }
  /* a11y overlay：每粒子一个真实可聚焦 button（canvas 命中配同步 DOM，契约） */
  #overlay { position: fixed; inset: 0; pointer-events: none; }
  #overlay button { position: absolute; transform: translate(-50%, -50%); width: 22px; height: 22px;
    background: transparent; border: none; border-radius: 50%; pointer-events: auto; cursor: pointer; padding: 0; }
  #overlay button:focus-visible { outline: 1.5px solid rgba(170,215,255,.9); outline-offset: 2px; }
  @media (max-width: 480px) {
    #hud .thesis { font-size: 13px; }
    #legend { font-size: 10px; line-height: 1.7; }
    #hovercard { right: 8px; left: 8px; width: auto; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud">
  <div class="thesis">召回只激起涟漪，结果才留下潮痕。</div>
  <div class="meta" id="meta"></div>
  <div class="script" id="scriptline"></div>
</div>
<div id="legend">
  <div class="row"><span class="swatch"></span>内环 锚定层 · 长时记忆 / 高保留</div>
  <div class="row"><span class="swatch"></span>中环 活动潮带 · 在用 / 等待结果</div>
  <div class="row"><span class="swatch dash"></span>外缘虚线 fade · 越线即将遗忘</div>
  <div class="dir">半径 = 保留强度（越靠中心越稳定）</div>
</div>
<div id="err"></div>
<div id="hovercard" role="status"></div>
<div id="drawer" role="dialog" aria-modal="false" aria-label="记忆详情"></div>
<div id="overlay"></div>
<script type="module">
import { layoutPool, fadeLineRadius, radiusOf, POOL_CFG } from '/src/pool/layout-pool.mjs'

const canvas = document.getElementById('stage')
const ctx = canvas.getContext('2d')
const meta = document.getElementById('meta')
const scriptline = document.getElementById('scriptline')
const DPR = Math.min(window.devicePixelRatio || 1, 2)
// 四审 P2：运行中响应系统无障碍偏好变化，不只在 boot 读一次
const rmQuery = matchMedia('(prefers-reduced-motion: reduce)')
let REDUCED = rmQuery.matches
// Gate 2 P2 债②：切到 reduce 不只影响后续事件——在跑动画当场 snap 到同一信息终态
rmQuery.addEventListener?.('change', (e) => {
  REDUCED = e.matches
  if (!REDUCED) return
  for (const tw of tweens) tw.p.pr = tw.to          // 迁移直落终态
  tweens = []
  for (const d of drops) { if (d.spawn) { particles.push(d.spawn); d.spawn = null } }  // 待生成粒子落下
  drops = []
  ripples = []                                       // 移动涟漪清除；潮痕静态标记保留
  draw(performance.now())
})

// particles: layout 输出 + 呈现态（pr = presentation radius，迁移持久不回跳）
let particles = [], fadeR = fadeLineRadius(0.15)
let ripples = []        // { theta, r, t0 }
let drops = []          // { theta, r, t0, spawn }（spawn: 落滴结束后留存的新粒子）
let tweens = []         // { p, from, to, t0, dur }（可中断：新 tween 从当前 pr 起算并顶掉旧的）
// 四审 P1-3：潮痕是事件 signature 不是常驻编码——settle 后停留 RING_STAY 再淡出，
// 半径终态持久；最新 outcome 状态属于 hover/drawer（本原型不实现）
let rings = []          // { p, kind: 'credited'|'blamed', t0, until }
const RING_STAY = 4500, RING_FADE = 800
let rafActive = false

const geo = () => {
  const w = canvas.clientWidth, h = canvas.clientHeight
  return { w, h, cx: w / 2, cy: h / 2, R: Math.min(w, h) * 0.44 }
}
const resize = () => {
  canvas.width = canvas.clientWidth * DPR
  canvas.height = canvas.clientHeight * DPR
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
}
addEventListener('resize', () => { resize(); draw(performance.now()) })

const easeInOut = (k) => (k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2)

// 迁移：从当前呈现值 retarget（可中断）；REDUCED 直落终态
const migrate = (p, to, dur = 1500) => {
  if (REDUCED) { p.pr = to; requestDraw(); return }
  tweens = tweens.filter(t => t.p !== p)          // 中断旧 tween：from 取当前 pr，不回跳
  tweens.push({ p, from: p.pr, to, t0: performance.now(), dur })
  requestDraw()
}

// Gate 2 P2 债①：潮痕静态停留期不算 active（约 270 帧空转）——只有淡出窗口逐帧；
// addRing 用 timer 在 fade 起点唤醒 rAF
const ringFading = (now) => rings.some(rg => now >= rg.t0 + RING_STAY)
const anyActive = (now = performance.now()) =>
  tweens.length || ripples.length || drops.length || ringFading(now)
const requestDraw = () => {
  if (rafActive) return
  rafActive = true
  const loop = (t) => {
    step(t); draw(t)
    if (anyActive()) requestAnimationFrame(loop)
    else rafActive = false                         // 三审：无活跃动画即停帧，不空转
  }
  requestAnimationFrame(loop)
}

const step = (now) => {
  for (const tw of tweens) {
    const k = Math.min(1, (now - tw.t0) / tw.dur)
    tw.p.pr = tw.from + (tw.to - tw.from) * easeInOut(k)
  }
  tweens = tweens.filter(tw => now - tw.t0 < tw.dur)
  ripples = ripples.filter(r => now - r.t0 < 1400)
  for (const d of drops) {
    if (now - d.t0 >= 900 && d.spawn) { particles.push(d.spawn); d.spawn = null }  // 落滴结束→粒子留存
  }
  drops = drops.filter(d => now - d.t0 < 900)
  rings = rings.filter(rg => now < rg.until)          // 潮痕到期即清，不留常驻残影
}

const ringMark = (x, y, rad, kind, alpha) => {
  ctx.lineWidth = 1.4
  ctx.strokeStyle = kind === 'credited' ? `rgba(170,215,255,${0.75 * alpha})` : `rgba(150,175,200,${0.6 * alpha})`
  if (kind === 'credited') { ctx.beginPath(); ctx.arc(x, y, rad, 0, 7); ctx.stroke() }  // 完整潮痕环
  else {                                                                      // 断裂侵蚀环：三段缺口弧
    for (const [a, b] of [[0.1, 1.7], [2.3, 3.9], [4.5, 6.0]]) {
      ctx.beginPath(); ctx.arc(x, y, rad, a, b); ctx.stroke()
    }
  }
}
const addRing = (p, kind) => {
  const now = performance.now()
  rings = rings.filter(rg => rg.p !== p)              // 同粒子新 outcome 顶掉旧痕
  rings.push({ p, kind, t0: now, until: now + RING_STAY + RING_FADE })
  setTimeout(() => requestDraw(), RING_STAY)          // fade 起点按时唤醒，停留期零帧
}

const draw = (now = 0) => {
  const { w, h, cx, cy, R } = geo()
  ctx.clearRect(0, 0, w, h)
  const ring = (r, alpha, dash = false) => {
    if (dash) ctx.setLineDash([4, 6])
    ctx.beginPath(); ctx.arc(cx, cy, r * R, 0, 7)
    ctx.strokeStyle = `rgba(140,170,205,${alpha})`; ctx.lineWidth = 1; ctx.stroke()
    ctx.setLineDash([])
  }
  ring(POOL_CFG.PIN_RING, 0.10)
  ring(radiusOf({ pinned: false, effective_strength: POOL_CFG.ANCHOR_MIN }), 0.10)
  ring(radiusOf({ pinned: false, effective_strength: POOL_CFG.RECEDING_MAX }), 0.10)
  ring(fadeR, 0.22, true)

  for (const p of particles) {
    const x = cx + p.pr * R * Math.cos(p.theta), y = cy + p.pr * R * Math.sin(p.theta)
    ctx.beginPath(); ctx.arc(x, y, p.markR * R, 0, 7)
    ctx.fillStyle = 'rgba(190,215,240,.85)'; ctx.fill()
  }
  for (const rg of rings) {                            // 潮痕：停留后淡出，跟随粒子当前呈现位
    const x = cx + rg.p.pr * R * Math.cos(rg.p.theta), y = cy + rg.p.pr * R * Math.sin(rg.p.theta)
    const alpha = now < rg.t0 + RING_STAY ? 1 : Math.max(0, 1 - (now - rg.t0 - RING_STAY) / RING_FADE)
    ringMark(x, y, (rg.p.markR + 0.008) * R, rg.kind, alpha)
  }
  for (const rp of ripples) {
    const k = (now - rp.t0) / 1400
    const x = cx + rp.r * R * Math.cos(rp.theta), y = cy + rp.r * R * Math.sin(rp.theta)
    ctx.beginPath(); ctx.arc(x, y, (0.01 + k * 0.09) * R, 0, 7)
    ctx.strokeStyle = `rgba(150,200,255,${(1 - k) * 0.5})`; ctx.lineWidth = 1.5; ctx.stroke()
  }
  for (const d of drops) {
    const k = (now - d.t0) / 900
    const x = cx + d.r * R * Math.cos(d.theta), y = cy + d.r * R * Math.sin(d.theta)
    ctx.beginPath(); ctx.arc(x, y, (0.004 + (1 - k) * 0.012) * R, 0, 7)
    ctx.fillStyle = `rgba(200,225,250,${0.9 - k * 0.6})`; ctx.fill()
  }
}

// 四审 P1-1：首屏请求有界退避（0/750/1500/3000ms 共 4 次），耗尽后给显式 retry
// action，禁止无限重试——demo 白屏（server 瞬断返回 internal_error）已实测复现过
const fetchSnapshot = async () => {
  const delays = [0, 750, 1500, 3000]
  let lastErr = null
  for (let i = 0; i < delays.length; i++) {
    if (delays[i]) await new Promise(r => setTimeout(r, delays[i]))
    meta.textContent = i === 0 ? 'loading /viz/ocean …' : `重试 ${i}/${delays.length - 1} …`
    try {
      // Gate 2 P2 债③：单次 attempt 硬超时——网络半开不再无限挂，错误走既有退避/手动重试
      const res = await fetch('/viz/ocean', { signal: AbortSignal.timeout(6000) })
      const snap = await res.json()
      if (snap.ok) return snap
      lastErr = new Error(snap.error || 'snapshot failed')
    } catch (e) { lastErr = e }
  }
  throw lastErr
}

const showRetry = (e) => {
  const el = document.getElementById('err')
  el.style.display = 'grid'
  el.innerHTML = ''
  const box = document.createElement('div')
  box.style.textAlign = 'center'
  const msg = document.createElement('div')
  msg.textContent = `数据面暂不可用（4 次退避已耗尽）：${e.message}`
  const btn = document.createElement('button')
  btn.textContent = '重试'
  btn.style.cssText = 'margin-top:12px;padding:6px 22px;background:#16202c;color:#b8c7d9;border:1px solid #2c3a4c;border-radius:4px;cursor:pointer'
  btn.onclick = () => { el.style.display = 'none'; boot().catch(showRetry) }
  box.append(msg, btn)
  el.append(box)
}

// ---- 交互层（契约 D + V-6：hover 固定卡吃快照数据零请求，drawer 打 detail 端点；
//      hover/focus/click/drawer 全部从 layout 最终 painted anchor 展开——唯一坐标源）----
const hovercard = document.getElementById('hovercard')
const drawer = document.getElementById('drawer')
const overlay = document.getElementById('overlay')
const memIndex = new Map()      // memory_id -> 快照 memory 行
let drawerOpener = null         // ESC 后焦点归还
const LAYER_ZH = { anchor: '锚定层', active_tide: '活动潮带', receding_edge: '退潮边缘' }

const anchorXY = (p) => {
  const { cx, cy, R } = geo()
  return [cx + p.pr * R * Math.cos(p.theta), cy + p.pr * R * Math.sin(p.theta)]
}
const ageDays = (iso) => Math.max(0, (Date.now() - Date.parse(iso)) / 864e5).toFixed(1)

let hoverTimer = null
const showHover = (p) => {
  const m = memIndex.get(p.memory_id)
  if (!m) return
  hovercard.innerHTML = ''
  const rows = [
    ['kind', m.kind ?? '—'], ['层', (m.pinned ? 'pinned · ' : '') + LAYER_ZH[p.layer]],
    ['年龄', `${ageDays(m.created_at)} 天`], ['保留', `${(p.s * 100).toFixed(1)}%`],
    ['结果', `credited ${m.credited} / blamed ${m.blamed}`],
  ]
  for (const [k, v] of rows) {
    const d = document.createElement('div')
    const ks = document.createElement('span'); ks.className = 'k'; ks.textContent = k
    d.append(ks, document.createTextNode(String(v)))
    hovercard.append(d)
  }
  const pv = document.createElement('div'); pv.className = 'preview'
  pv.textContent = (m.content_preview ?? '').slice(0, 80)
  hovercard.append(pv)
  hovercard.style.display = 'block'
}
const hideHover = () => { clearTimeout(hoverTimer); hovercard.style.display = 'none' }
const hoverIntent = (p) => { clearTimeout(hoverTimer); hoverTimer = setTimeout(() => showHover(p), 150) }

const esc = (s) => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML }
const openDrawer = async (p, opener) => {
  drawerOpener = opener ?? null
  drawer.innerHTML = '<button class="close" aria-label="关闭">ESC</button><div class="meta">loading…</div>'
  drawer.classList.add('open')
  drawer.querySelector('.close').onclick = closeDrawer
  let d
  try {
    const res = await fetch(`/viz/memory/${p.memory_id}`, { signal: AbortSignal.timeout(6000) })
    d = await res.json()
  } catch (e) { d = { ok: false, error: e.message } }
  if (!d.ok) { drawer.querySelector('.meta').textContent = `加载失败：${d.error}（ESC 关闭后重试）`; return }
  const m = d.memory
  const curvePts = d.curve.filter(c => c.s != null)
  const svgPts = curvePts.map((c, i) => `${(i / Math.max(1, curvePts.length - 1) * 100).toFixed(2)},${(64 - c.s * 60).toFixed(2)}`).join(' ')
  const fadeY = (64 - d.fade_threshold * 60).toFixed(2)
  drawer.innerHTML = `
    <button class="close" aria-label="关闭">ESC</button>
    <h2>${esc(m.kind ?? 'memory')} · ${m.pinned ? 'pinned' : esc(m.state)}</h2>
    <div class="meta">${esc(m.memory_id.slice(0, 8))} · ${esc(m.episode_id ?? 'loose')} · ${ageDays(m.created_at)} 天前 · 保留 ${(m.effective_strength * 100).toFixed(1)}%</div>
    <div class="content">${esc(m.content)}</div>
    <div class="scope">${m.content_scope === 'full' ? '全文' : '预览口径（viewer 键）'}${m.content_truncated ? ' · 已截断' : ''}</div>
    <div class="sec">衰减曲线（服务端采样 ±96h）</div>
    <svg id="curve" viewBox="0 0 100 68" preserveAspectRatio="none">
      <line x1="0" y1="${fadeY}" x2="100" y2="${fadeY}" stroke="rgba(150,175,200,.3)" stroke-dasharray="2 2" stroke-width=".5"/>
      <polyline points="${svgPts}" fill="none" stroke="rgba(170,215,255,.85)" stroke-width="1"/>
    </svg>
    <div class="sec">归因（最近 ${d.attributions.length} 条）</div>
    ${d.attributions.map(a => `<div class="attr">${a.role === 'credited' ? '潮痕 credited' : '侵蚀 blamed'}${a.applied ? '' : `（未应用：${esc(a.reason ?? '')}）`}
      <span class="amt">${a.plasticity ? `${a.plasticity.effective_before} → ${a.plasticity.strength_anchor_after}` : ''}</span>
      <div class="meta">${esc(String(a.reported_at).slice(0, 19))} · ${esc(a.episode_id ?? '')}</div></div>`).join('') || '<div class="meta">尚无 outcome——只被召回过的记忆不会移动</div>'}
    ${d.related.length ? `<div class="sec">关联</div>` + d.related.map(r => `<div class="attr">${r.kind} · ${esc(r.memory_id.slice(0, 8))}</div>`).join('') : ''}
  `
  drawer.querySelector('.close').onclick = closeDrawer
}
const closeDrawer = () => {
  drawer.classList.remove('open')
  if (drawerOpener) { drawerOpener.focus(); drawerOpener = null }
}
addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeDrawer(); hideHover() } })

// a11y overlay：每粒子一个真实 button（Tab 巡航/Enter 原生获得；canvas 命中配同步 DOM）
const buildOverlay = () => {
  overlay.innerHTML = ''
  for (const p of particles) {
    const m = memIndex.get(p.memory_id)
    const b = document.createElement('button')
    const [x, y] = anchorXY(p)
    b.style.left = `${x}px`; b.style.top = `${y}px`
    b.setAttribute('aria-label', `${LAYER_ZH[p.layer]} 记忆：${(m?.content_preview ?? '').slice(0, 40)}`)
    b.addEventListener('mouseenter', () => hoverIntent(p))
    b.addEventListener('mouseleave', hideHover)
    b.addEventListener('focus', () => showHover(p))
    b.addEventListener('blur', hideHover)
    b.addEventListener('click', (ev) => openDrawer(p, ev.currentTarget))
    overlay.append(b)
  }
}
addEventListener('resize', () => buildOverlay())

const boot = async () => {
  resize()
  const snap = await fetchSnapshot()
  const memories = [...snap.episodes.flatMap(e => e.memories), ...snap.loose]
  for (const m of memories) memIndex.set(m.memory_id, m)
  fadeR = fadeLineRadius(snap.fade_threshold)
  const { placed, overflow } = layoutPool(memories)
  particles = placed.map(p => ({ ...p, pr: p.r }))
  buildOverlay()
  meta.textContent = `${snap.total_memories} memories · ${snap.snapshot_at}` +
    (overflow.length ? ` · overflow ${overflow.length}（显式）` : '') + (snap.capped ? ' · CAPPED' : '')
  draw(performance.now())

  if (new URLSearchParams(location.search).get('script') === '1' && particles.length > 2) {
    // remember 演示走正常 layout target：把 scripted 记忆并入 fixture 重跑 layout，
    // 其 created_at 最新 → 时序 rank 居末 → 既有粒子位置不受扰动（确定性布局保证）
    const scripted = { memory_id: 'ffffffff-ffff-4fff-8fff-ffffffffffff', pinned: false,
      effective_strength: 0.82, created_at: new Date(Date.parse(snap.snapshot_at) + 1000).toISOString() }
    const relaid = layoutPool([...memories, scripted])
    const spawnPlace = relaid.placed.find(p => p.memory_id === scripted.memory_id)

    const seq = [
      ['remember：一滴雨落入潮池，新粒子生成并留下', (t) => {
        if (!spawnPlace) { scriptline.textContent += '（overflow——显式，跳过）'; return }
        const spawn = { ...spawnPlace, pr: spawnPlace.r }
        if (REDUCED) { particles.push(spawn); requestDraw(); return }
        drops.push({ theta: spawnPlace.theta, r: spawnPlace.r, t0: t, spawn })
      }],
      ['recall：只激起涟漪，粒子不移动', (t) => {
        const p = particles[1]
        if (REDUCED) return                                   // reduced：无位移事件无需演
        ripples.push({ theta: p.theta, r: p.pr, t0: t })
      }],
      ['credited (applied)：留下完整潮痕（停留后淡出），向中心迁移', () => {
        const p = particles[1]
        addRing(p, 'credited')                                 // 痕先落，位移随后；痕淡出、半径持久
        migrate(p, Math.max(POOL_CFG.PIN_RING, p.pr - 0.15))
      }],
      ['blamed (applied)：断裂侵蚀痕（停留后淡出），向外迁移', () => {
        const p = particles[2]
        addRing(p, 'blamed')
        migrate(p, Math.min(1 - POOL_CFG.OUTER_INSET, p.pr + 0.15))
      }],
      ['cancelled / late：什么都不发生（无粒子可动）', () => {}],
      ['passive decay：属快照差值，此处不演', () => {}],
    ]
    let i = 0
    const stepSeq = () => {
      if (i >= seq.length) { scriptline.textContent = 'SCRIPTED 序列结束（真实动画只认 /viz/activity）'; draw(performance.now()); return }
      const [label, fx] = seq[i++]
      scriptline.textContent = `SCRIPTED ${i}/${seq.length} · ${label}`
      fx(performance.now())
      requestDraw()
      setTimeout(stepSeq, REDUCED ? 1400 : 2200)               // reduced：终态直落，节奏收紧
    }
    stepSeq()
  }
}
boot().catch(showRetry)
</script>
