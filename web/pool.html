<!doctype html>
<!-- P0-11 v2 原型（开工门第二步，三审修订）：真实 /viz/ocean 快照 → 记忆潮池一屏。
     零 React 零依赖；dev 走 vite 代理注入 viz key，production 由 CloudFront origin header
     贴 viz key（浏览器零凭证语义两端一致）。本页已进 vite build input（check-dist.mjs 把门）。
     ?script=1 播放 scripted 因果序列（明示 SCRIPTED，只演动态语法；真实动画只认 /viz/activity）。
     三审动效修订：remember 真生成并留存粒子（走正常 layout target）；per-particle
     presentation radius（迁移持久、从当前呈现值可中断 retarget，不回跳）；credited 完整
     潮痕环 / blamed 断裂侵蚀环（全页唯一 signature）；prefers-reduced-motion 直落终态；
     rAF 只在有活跃动画时调度。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidemark · 记忆潮池</title>
<style>
  html, body { margin: 0; height: 100%; background: #07090c; color: #b8c7d9;
    font: 13px/1.5 system-ui, sans-serif; }
  #stage, #stage3d { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #stage { display: block; }
  #stage3d { display: none; overflow: hidden; background: #05080d; touch-action: none; }
  #stage3d canvas { display: block; width: 100%; height: 100%; }
  body.three-preview #stage { display: none; }
  body.three-preview #stage3d { display: block; }
  /* 三审 P1-2：thesis 是首屏唯一解释文字；技术元数据降为暗色小字 */
  #hud { position: fixed; left: 16px; top: 14px; right: 16px; z-index: 3; user-select: none; pointer-events: none; }
  #hud .thesis { font-size: 15px; font-weight: 600; color: #dfe9f5; letter-spacing: .05em; }
  #hud .meta { opacity: .32; font-size: 11px; margin-top: 3px; }
  #hud .script { color: #8fb8e8; font-size: 12px; margin-top: 8px; min-height: 1.2em; }
  /* 三审 P1-3：层名移出 canvas——固定 legend（结构编码），不与数据粒子争位 */
  #legend { position: fixed; left: 16px; bottom: 14px; z-index: 3; user-select: none; pointer-events: none;
    font-size: 11px; line-height: 1.9; opacity: .62; }
  #legend .row { display: flex; align-items: center; gap: 8px; }
  #legend .swatch { width: 18px; height: 0; border-top: 1px solid rgba(140,170,205,.7); }
  #legend .swatch.dash { border-top-style: dashed; }
  #legend .dir { opacity: .6; margin-top: 2px; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #d98c8c; }
  /* hover 卡（Owner 裁定改稿：出现在鼠标当前位置，不再固定角落）：
     150ms intent 延迟 + 120ms ease-out 淡入上浮；连续悬停走热路径立即显示 */
  #hovercard { position: fixed; left: 0; top: 0; box-sizing: border-box;
    width: min(260px, calc(100vw - 16px)); max-height: calc(100vh - 16px); overflow: hidden;
    padding: 10px 12px;
    background: rgba(13,18,24,.92); border: 1px solid #223042; border-radius: 6px;
    font-size: 12px; line-height: 1.6; pointer-events: none; z-index: 5;
    opacity: 0; visibility: hidden; transform: translateY(4px);
    transition: opacity 120ms cubic-bezier(0.23,1,0.32,1), transform 120ms cubic-bezier(0.23,1,0.32,1),
      visibility 0s linear 120ms; }
  #hovercard.show { opacity: 1; visibility: visible; transform: translateY(0); transition-delay: 0s; }
  #hovercard .k { opacity: .5; margin-right: 6px; }
  #hovercard .preview { margin-top: 6px; opacity: .8; }
  /* 详情（Owner 裁定改稿：居中 modal，不再右侧抽屉）：scale .96→1 + 淡入，
     进 220ms / 出 160ms 不对称；detail 真源；reduced-motion 下无过渡 */
  #scrim { position: fixed; inset: 0; background: rgba(4,7,11,.55); opacity: 0;
    pointer-events: none; z-index: 9; transition: opacity 200ms cubic-bezier(0.23,1,0.32,1); }
  #scrim.show { opacity: 1; pointer-events: auto; }
  #drawer { position: fixed; left: 50%; top: 50%; box-sizing: border-box;
    width: min(520px, calc(100vw - 16px));
    max-height: min(78vh, 660px, calc(100vh - 16px)); background: #0b0f14; border: 1px solid #223042;
    border-radius: 10px; padding: 18px 20px; overflow-y: auto; z-index: 10;
    font-size: 13px; line-height: 1.65; opacity: 0; pointer-events: none;
    transform: translate(-50%, -50%) scale(0.96);
    transition: opacity 160ms cubic-bezier(0.23,1,0.32,1), transform 160ms cubic-bezier(0.23,1,0.32,1); }
  #drawer.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1);
    transition-duration: 220ms, 220ms; }
  @media (prefers-reduced-motion: reduce) { #drawer, #scrim, #hovercard { transition: none; } }
  #drawer h2 { font-size: 13px; margin: 0 0 4px; color: #dfe9f5; }
  #drawer .meta { font-size: 11px; opacity: .5; margin-bottom: 12px; }
  #drawer .content { white-space: pre-wrap; background: rgba(140,170,205,.05);
    padding: 10px; border-radius: 4px; margin-bottom: 4px; }
  #drawer .scope { font-size: 11px; opacity: .45; margin-bottom: 12px; }
  #drawer .sec { font-size: 11px; letter-spacing: .1em; opacity: .5; margin: 14px 0 6px; }
  #drawer .attr { padding: 6px 0; border-top: 1px solid rgba(140,170,205,.08); font-size: 12px; }
  #drawer .attr .amt { float: right; opacity: .7; }
  #drawer button.close { position: absolute; top: 12px; right: 14px; background: none;
    border: 1px solid #2c3a4c; color: #b8c7d9; border-radius: 4px; padding: 2px 10px; cursor: pointer; }
  #curve { width: 100%; height: 72px; margin: 4px 0; }
  /* a11y overlay：每粒子一个真实可聚焦 button（canvas 命中配同步 DOM，契约） */
  #overlay { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
  #overlay button { position: absolute; left: 0; top: 0; width: 22px; height: 22px;
    background: transparent; border: none; border-radius: 50%; pointer-events: auto; cursor: pointer; padding: 0; }
  #overlay button:focus-visible { outline: 1.5px solid rgba(170,215,255,.9); outline-offset: 2px; }
  @media (max-width: 480px) {
    #hud .thesis { font-size: 13px; }
    #legend { font-size: 10px; line-height: 1.7; }
  }
</style>
</head>
<body>
<div id="stage3d" aria-hidden="true"></div>
<canvas id="stage"></canvas>
<div id="hud">
  <div class="thesis">召回只激起涟漪，结果才留下潮痕。</div>
  <div class="meta" id="meta"></div>
  <div class="script" id="scriptline"></div>
</div>
<div id="legend">
  <div class="row"><span class="swatch"></span>内环 锚定层 · 长时记忆 / 高保留</div>
  <div class="row"><span class="swatch"></span>中环 活动潮带 · 在用 / 等待结果</div>
  <div class="row"><span class="swatch dash"></span>外缘虚线 fade · 越线即将遗忘</div>
  <div class="dir">半径 = 保留强度（越靠中心越稳定）</div>
</div>
<div id="err"></div>
<div id="hovercard" role="status"></div>
<div id="scrim"></div>
<div id="drawer" role="dialog" aria-modal="true" aria-label="记忆详情" inert aria-hidden="true"></div>
<div id="overlay"></div>
<script type="module">
import { layoutPool, fadeLineRadius, radiusOf, POOL_CFG } from '/src/pool/layout-pool.mjs'
import { makeDrawerGuard } from '/src/pool/drawer-guard.mjs'
import { makeLiveCoordinator, outcomeActions, eventCausesRefresh, diffSnapshot } from '/src/pool/live-coordinator.mjs'
import { MOTION, easeOutStrong, easeInQuad, makeMotionState } from '/src/pool/motion-sync.mjs'
import { wantsThreePreview } from '/src/pool/three/config.mjs'

const canvas = document.getElementById('stage')
const ctx = canvas.getContext('2d')
const stage3d = document.getElementById('stage3d')
const meta = document.getElementById('meta')
const scriptline = document.getElementById('scriptline')
const DPR = Math.min(window.devicePixelRatio || 1, 2)
const THREE_REQUESTED = wantsThreePreview(location.search)
let threePool = null
// 四审 P2：运行中响应系统无障碍偏好变化，不只在 boot 读一次
const rmQuery = matchMedia('(prefers-reduced-motion: reduce)')
let REDUCED = rmQuery.matches
// Gate 2 P2 债②：切到 reduce 不只影响后续事件——在跑动画当场 snap 到同一信息终态
rmQuery.addEventListener?.('change', (e) => {
  REDUCED = e.matches
  threePool?.setReducedMotion(REDUCED)
  if (!REDUCED) { requestDraw(); return }            // 关掉 reduce：重启常驻呼吸
  motion.reduceFlush()                               // 迁移直落终态并标 dirty（P1-1 反例②），生长/入场直落
  for (const d of drops) { if (d.spawn) { attachParticle(d.spawn); d.spawn = null } }  // 待生成粒子落下
  drops = []
  ripples = []                                       // 移动涟漪清除；潮痕静态标记保留
  draw(performance.now())                            // draw 帧末消费 dirty，按钮同步终态
})

// particles: layout 输出 + 呈现态（pr = presentation radius，迁移持久不回跳；
// mrScale = 着水生长系数；alpha = 首屏入场淡入系数，完成后恒 1）。
// tween/grow/entrance 与持久 dirty 集全部住在 motion-sync 状态机里（一审 P1-1：
// 脏标记跨 step→draw 存活，node 判别 M1-M5 直接测它）
const motion = makeMotionState()
let particles = [], fadeR = fadeLineRadius(0.15)
let ripples = []        // { theta, r, t0, small }（small: 着水微涟漪/多目标 recall 收敛尺寸）
let drops = []          // { theta, r, t0, spawn }（雨滴：下落→着水→spawn 留存）
// 四审 P1-3：潮痕是事件 signature 不是常驻编码——settle 后停留 RING_STAY 再淡出，
// 半径终态持久；最新 outcome 状态属于 hover/drawer
let rings = []          // { p, kind: 'credited'|'blamed', t0, until }
const RING_STAY = MOTION.RING_STAY, RING_FADE = MOTION.RING_FADE
let rafActive = false

const geo = () => {
  const w = canvas.clientWidth, h = canvas.clientHeight
  return { w, h, cx: w / 2, cy: h / 2, R: Math.min(w, h) * 0.44 }
}

// ---- 柔光粒 sprite（Owner 裁定"点变星星"）：预渲染一次 drawImage 缩放——
// 每帧上百个 createRadialGradient 太贵；渐变淡向同色 alpha 0（结论 58 两戒①）----
const glowSprite = (() => {
  const S = 64
  const c = document.createElement('canvas'); c.width = c.height = S
  const g = c.getContext('2d')
  const grad = g.createRadialGradient(S / 2, S / 2, S * 0.06, S / 2, S / 2, S / 2)
  grad.addColorStop(0, 'rgba(222,240,255,0.95)')
  grad.addColorStop(0.25, 'rgba(190,215,240,0.5)')
  grad.addColorStop(1, 'rgba(190,215,240,0)')
  g.fillStyle = grad
  g.fillRect(0, 0, S, S)
  return c
})()
// 常驻氛围（Owner 裁定，覆盖"无活跃动画即停帧"的旧省帧项）：高保留粒子极缓亮度呼吸；
// reduced-motion 或标签页隐藏时仍停帧（省电与无障碍边界保留）
const ambientOn = () => !threePool && !REDUCED && !document.hidden
document.addEventListener('visibilitychange', () => { if (!document.hidden) requestDraw() })
const resize = () => {
  canvas.width = canvas.clientWidth * DPR
  canvas.height = canvas.clientHeight * DPR
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
  threePool?.resize()
}
addEventListener('resize', () => { resize(); draw(performance.now()) })

// 迁移：从当前呈现值 retarget（可中断）；REDUCED 直落终态（motion 内部标 dirty）
const migrate = (p, to, dur = MOTION.MIGRATE_MS) => {
  motion.migrate(p, to, { dur, reduced: REDUCED, now: performance.now() })
  requestDraw()
}

// Gate 2 P2 债①：潮痕静态停留期不算 active（约 270 帧空转）——只有淡出窗口逐帧；
// addRing 用 timer 在 fade 起点唤醒 rAF
const ringFading = (now) => rings.some(rg => now >= rg.t0 + RING_STAY)
const anyActive = (now = performance.now()) =>
  motion.active() || ripples.length || drops.length || ringFading(now)
const requestDraw = () => {
  if (rafActive) return
  rafActive = true
  const loop = (t) => {
    // 异常护栏：draw 一旦抛错不得把 rafActive 卡死在 true（否则后续 requestDraw 全部
    // 空操作、step 永不再跑——spawn 不 attach、过期 drop 不清的连锁事故，实测抓获）
    try {
      step(t); draw(t)
    } catch (e) {
      rafActive = false
      throw e
    }
    if (anyActive() || ambientOn()) requestAnimationFrame(loop)
    else rafActive = false                         // reduced/隐藏标签页仍停帧；常驻呼吸由 ambientOn 驱动
  }
  requestAnimationFrame(loop)
}

const step = (now) => {
  motion.step(now)                                   // tween/grow/entrance 推进（完成帧仍标 dirty，P1-1 反例①）
  ripples = ripples.filter(r => now - r.t0 < MOTION.RIPPLE_MS)
  for (const d of drops) {
    // 雨滴着水：微涟漪 + spawn 留存（生长起步消除尺寸 pop）
    if (now - d.t0 >= MOTION.RAIN_FALL_MS && d.spawn) {
      ripples.push({ theta: d.theta, r: d.r, t0: now, small: true })
      attachParticle(d.spawn); d.spawn = null
    }
  }
  drops = drops.filter(d => now - d.t0 < MOTION.RAIN_FALL_MS)
  rings = rings.filter(rg => now < rg.until)          // 潮痕到期即清，不留常驻残影
}

const ringMark = (x, y, rad, kind, alpha) => {
  ctx.lineWidth = 1.4
  ctx.strokeStyle = kind === 'credited' ? `rgba(170,215,255,${0.75 * alpha})` : `rgba(150,175,200,${0.6 * alpha})`
  if (kind === 'credited') { ctx.beginPath(); ctx.arc(x, y, rad, 0, 7); ctx.stroke() }  // 完整潮痕环
  else {                                                                      // 断裂侵蚀环：三段缺口弧
    for (const [a, b] of [[0.1, 1.7], [2.3, 3.9], [4.5, 6.0]]) {
      ctx.beginPath(); ctx.arc(x, y, rad, a, b); ctx.stroke()
    }
  }
}
const addRing = (p, kind) => {
  const now = performance.now()
  rings = rings.filter(rg => rg.p !== p)              // 同粒子新 outcome 顶掉旧痕
  rings.push({ p, kind, t0: now, until: now + RING_STAY + RING_FADE })
  setTimeout(() => requestDraw(), RING_STAY)          // fade 起点按时唤醒，停留期零帧
}

const draw = (now = 0) => {
  if (threePool?.active) {
    threePool.setParticles(particles, {
      pin: POOL_CFG.PIN_RING,
      anchor: radiusOf({ pinned: false, effective_strength: POOL_CFG.ANCHOR_MIN }),
      receding: radiusOf({ pinned: false, effective_strength: POOL_CFG.RECEDING_MAX }),
      fade: fadeR,
    })
    threePool.syncRipples(ripples)
    threePool.syncDrops(drops)
    threePool.syncRings(rings)
    motion.consumeDirty()
    return
  }
  const { w, h, cx, cy, R } = geo()
  ctx.clearRect(0, 0, w, h)
  const ring = (r, alpha, dash = false) => {
    if (dash) ctx.setLineDash([4, 6])
    ctx.beginPath(); ctx.arc(cx, cy, r * R, 0, 7)
    ctx.strokeStyle = `rgba(140,170,205,${alpha})`; ctx.lineWidth = 1; ctx.stroke()
    ctx.setLineDash([])
  }
  ring(POOL_CFG.PIN_RING, 0.10)
  ring(radiusOf({ pinned: false, effective_strength: POOL_CFG.ANCHOR_MIN }), 0.10)
  ring(radiusOf({ pinned: false, effective_strength: POOL_CFG.RECEDING_MAX }), 0.10)
  ring(fadeR, 0.22, true)

  for (const p of particles) {
    const x = cx + p.pr * R * Math.cos(p.theta), y = cy + p.pr * R * Math.sin(p.theta)
    const s = p.s ?? 0.5
    // 强度发光：保留越高越亮越实；呼吸幅度随强度缩放（弱记忆近乎不动），相位取 theta 确定性
    const breath = ambientOn() ? 1 + 0.07 * s * Math.sin(now / 2400 + p.theta * 7) : 1
    const lum = Math.min(1, (0.42 + 0.5 * s) * (p.alpha ?? 1) * breath)
    const mr = p.markR * (p.mrScale ?? 1) * R
    const halo = mr * 4.6
    ctx.globalAlpha = lum
    ctx.drawImage(glowSprite, x - halo, y - halo, halo * 2, halo * 2)   // 光晕（sprite 缩放）
    ctx.globalAlpha = 1
    ctx.beginPath(); ctx.arc(x, y, mr, 0, 7)                            // 亮核
    ctx.fillStyle = `rgba(226,242,255,${Math.min(1, lum + 0.15).toFixed(3)})`
    ctx.fill()
    if (p.pinned) {                                                      // pinned 常亮细环（与潮痕环区分：更细更近）
      ctx.beginPath(); ctx.arc(x, y, mr * 1.9, 0, 7)
      ctx.strokeStyle = `rgba(200,225,250,${(0.5 * (p.alpha ?? 1)).toFixed(3)})`
      ctx.lineWidth = 0.8; ctx.stroke()
    }
  }
  for (const rg of rings) {                            // 潮痕：停留后淡出，跟随粒子当前呈现位
    const x = cx + rg.p.pr * R * Math.cos(rg.p.theta), y = cy + rg.p.pr * R * Math.sin(rg.p.theta)
    const alpha = now < rg.t0 + RING_STAY ? 1 : Math.max(0, 1 - (now - rg.t0 - RING_STAY) / RING_FADE)
    ringMark(x, y, (rg.p.markR + 0.008) * R, rg.kind, alpha)
  }
  for (const rp of ripples) {
    // 物理感：半径快扩后减速（强 ease-out），振幅后段加速消散
    const k = Math.min(1, (now - rp.t0) / MOTION.RIPPLE_MS)
    const g = easeOutStrong(k)
    const max = rp.small ? 0.045 : 0.09
    const x = cx + rp.r * R * Math.cos(rp.theta), y = cy + rp.r * R * Math.sin(rp.theta)
    ctx.beginPath(); ctx.arc(x, y, (0.01 + g * max) * R, 0, 7)
    ctx.strokeStyle = `rgba(150,200,255,${(Math.pow(1 - k, 1.4) * 0.5).toFixed(3)})`
    ctx.lineWidth = 1.5; ctx.stroke()
  }
  for (const d of drops) {
    // 雨滴（参考 rainform「data into rain」）：从上方 0.12R 处匀加速落体（ease-in=重力），
    // 滴头 + 短拖尾；着水事件在 step 里触发微涟漪与 spawn 留存
    const k = Math.min(1, (now - d.t0) / MOTION.RAIN_FALL_MS)
    const g = easeInQuad(k)
    const tx = cx + d.r * R * Math.cos(d.theta), ty = cy + d.r * R * Math.sin(d.theta)
    const y = ty - (1 - g) * 0.12 * R
    const alpha = 0.25 + k * 0.65
    ctx.strokeStyle = `rgba(200,225,250,${(alpha * 0.45).toFixed(3)})`
    ctx.lineWidth = 1
    ctx.beginPath(); ctx.moveTo(tx, y - 0.022 * R * (1 - g * 0.5)); ctx.lineTo(tx, y); ctx.stroke()
    ctx.beginPath(); ctx.arc(tx, y, 0.005 * R, 0, 7)
    ctx.fillStyle = `rgba(200,225,250,${alpha.toFixed(3)})`; ctx.fill()
  }
  // 按钮与 painted anchor 同帧（一审 P1-1）：消费持久 dirty 集——tween 逐帧/完成帧、
  // REDUCED 直落、theta-only relayout 三条路径统一走这里；消费即清，其余按钮不动
  if (typeof syncOverlay === 'function') {
    const dirty = motion.consumeDirty()
    if (dirty.length) syncOverlay(dirty)
  }
}

// 四审 P1-1：首屏请求有界退避（0/750/1500/3000ms 共 4 次），耗尽后给显式 retry
// action，禁止无限重试——demo 白屏（server 瞬断返回 internal_error）已实测复现过
const fetchSnapshot = async () => {
  const delays = [0, 750, 1500, 3000]
  let lastErr = null
  for (let i = 0; i < delays.length; i++) {
    if (delays[i]) await new Promise(r => setTimeout(r, delays[i]))
    meta.textContent = i === 0 ? 'loading /viz/ocean …' : `重试 ${i}/${delays.length - 1} …`
    try {
      // Gate 2 P2 债③：单次 attempt 硬超时——网络半开不再无限挂，错误走既有退避/手动重试
      const res = await fetch('/viz/ocean', { signal: AbortSignal.timeout(20000) })  // CRDB 冷唤醒实测可达 20s+
      const snap = await res.json()
      if (snap.ok) return snap
      lastErr = new Error(snap.error || 'snapshot failed')
    } catch (e) { lastErr = e }
  }
  throw lastErr
}

const showRetry = (e) => {
  const el = document.getElementById('err')
  el.style.display = 'grid'
  el.innerHTML = ''
  const box = document.createElement('div')
  box.style.textAlign = 'center'
  const msg = document.createElement('div')
  msg.textContent = `数据面暂不可用（4 次退避已耗尽）：${e.message}`
  const btn = document.createElement('button')
  btn.textContent = '重试'
  btn.style.cssText = 'margin-top:12px;padding:6px 22px;background:#16202c;color:#b8c7d9;border:1px solid #2c3a4c;border-radius:4px;cursor:pointer'
  btn.onclick = () => { el.style.display = 'none'; boot().catch(showRetry) }
  box.append(msg, btn)
  el.append(box)
}

// ---- 交互层（契约 D + V-6：hover 固定卡吃快照数据零请求，drawer 打 detail 端点；
//      hover/focus/click/drawer 全部从 layout 最终 painted anchor 展开——唯一坐标源）----
const hovercard = document.getElementById('hovercard')
const drawer = document.getElementById('drawer')
const overlay = document.getElementById('overlay')
const memIndex = new Map()      // memory_id -> 快照 memory 行
let drawerOpener = null         // ESC 后焦点归还
const LAYER_ZH = { anchor: '锚定层', active_tide: '活动潮带', receding_edge: '退潮边缘' }

const anchorXY = (p) => {
  const projected = threePool?.active ? threePool.projectParticle(p) : null
  if (projected) return projected
  const { cx, cy, R } = geo()
  return [cx + p.pr * R * Math.cos(p.theta), cy + p.pr * R * Math.sin(p.theta)]
}
const ageDays = (iso) => Math.max(0, (Date.now() - Date.parse(iso)) / 864e5).toFixed(1)

let hoverTimer = null, hoverHiddenAt = 0
// Owner 裁定：卡出现在触发时鼠标所在位置（键盘 focus 无坐标→贴粒子 anchor），出现后不追鼠标
const placeHover = (px, py) => {
  const vw = innerWidth, vh = innerHeight
  hovercard.style.left = '0px'; hovercard.style.top = '0px'   // 先归零再量，避免旧位截断影响尺寸
  const w = hovercard.offsetWidth || 260, h = hovercard.offsetHeight || 120
  let x = px + 14, y = py + 12
  if (x + w > vw - 8) x = px - w - 14
  if (y + h > vh - 8) y = py - h - 12
  // 真夹取（二审 P2-1）：双侧钳到 [8, viewport - size - 8]，卡比视口大时 CSS 已限尺寸+内滚
  x = Math.min(Math.max(8, x), Math.max(8, vw - w - 8))
  y = Math.min(Math.max(8, y), Math.max(8, vh - h - 8))
  hovercard.style.left = `${x}px`
  hovercard.style.top = `${y}px`
}
const showHover = (p, at) => {
  const m = memIndex.get(p.memory_id)
  if (!m) return
  hovercard.innerHTML = ''
  const rows = [
    ['kind', m.kind ?? '—'], ['层', (m.pinned ? 'pinned · ' : '') + LAYER_ZH[p.layer]],
    ['年龄', `${ageDays(m.created_at)} 天`], ['保留', `${(p.s * 100).toFixed(1)}%`],
    ['结果', `credited ${m.credited} / blamed ${m.blamed}`],
  ]
  for (const [k, v] of rows) {
    const d = document.createElement('div')
    const ks = document.createElement('span'); ks.className = 'k'; ks.textContent = k
    d.append(ks, document.createTextNode(String(v)))
    hovercard.append(d)
  }
  const pv = document.createElement('div'); pv.className = 'preview'
  pv.textContent = (m.content_preview ?? '').slice(0, 80)
  hovercard.append(pv)
  const [ax, ay] = at ?? anchorXY(p)
  placeHover(ax, ay)
  hovercard.classList.add('show')
}
const hideHover = () => {
  clearTimeout(hoverTimer)
  if (hovercard.classList.contains('show')) hoverHiddenAt = performance.now()
  hovercard.classList.remove('show')
}
// 连续悬停热路径（audit #4：工具栏 tooltip 模式）——刚看过一张卡，下一张免 intent 等待
const hoverIntent = (p, at) => {
  clearTimeout(hoverTimer)
  if (performance.now() - hoverHiddenAt < MOTION.HOVER_WARM_MS) { showHover(p, at); return }
  hoverTimer = setTimeout(() => showHover(p, at), MOTION.HOVER_INTENT_MS)
}

const esc = (s) => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML }
// 请求生命周期守卫（P1-4）：A→B 竞态与 close 后迟到响应统一由 guard 判废；
// 打开即移交焦点，关闭 inert+aria-hidden 移出可访问树并归还 opener
const guard = makeDrawerGuard()
const scrim = document.getElementById('scrim')
scrim.addEventListener('click', () => closeDrawer())
const openDrawer = async (p, opener) => {
  drawerOpener = opener ?? drawerOpener
  const token = guard.begin()
  drawer.removeAttribute('inert'); drawer.setAttribute('aria-hidden', 'false')
  overlay.setAttribute('inert', '')                 // 居中 modal（Owner 裁定）：打开期间粒子按钮出 Tab 序
  scrim.classList.add('show')
  hideHover()
  drawer.innerHTML = '<button class="close" aria-label="关闭">ESC</button><div class="meta">loading…</div>'
  drawer.classList.add('open')
  drawer.querySelector('.close').onclick = closeDrawer
  drawer.querySelector('.close').focus()
  let d
  try {
    const res = await fetch(`/viz/memory/${p.memory_id}`,
      { signal: AbortSignal.any([token.signal, AbortSignal.timeout(6000)].filter(Boolean)) })
    d = await res.json()
  } catch (e) { d = { ok: false, error: e.message } }
  if (!guard.isCurrent(token)) return          // 迟到响应：已被更新的 open 或 close 判废
  if (!d.ok) {
    drawer.querySelector('.meta').innerHTML = ''
    const msg = document.createElement('span')
    msg.textContent = `加载失败：${d.error} `
    const retry = document.createElement('button')
    retry.textContent = '重试'
    retry.style.cssText = 'margin-left:8px;padding:2px 12px;background:#16202c;color:#b8c7d9;border:1px solid #2c3a4c;border-radius:4px;cursor:pointer'
    retry.onclick = () => openDrawer(p, drawerOpener)
    drawer.querySelector('.meta').append(msg, retry)
    retry.focus()
    return
  }
  const m = d.memory
  // x 轴保真：按原 curve index 铺 0..100，null（锚点前禁区）断段绘制——
  // 不把合法曲线伪装成覆盖完整 ±96h（一审 P1-1 前端半）
  const N = d.curve.length
  const segs = []
  let cur = []
  d.curve.forEach((c, i) => {
    if (c.s == null) { if (cur.length) { segs.push(cur); cur = [] }; return }
    cur.push(`${(i / (N - 1) * 100).toFixed(2)},${(64 - c.s * 60).toFixed(2)}`)
  })
  if (cur.length) segs.push(cur)
  const curveSvg = segs.map(pts => `<polyline points="${pts.join(' ')}" fill="none" stroke="rgba(170,215,255,.85)" stroke-width="1"/>`).join('')
  const fadeY = (64 - d.fade_threshold * 60).toFixed(2)
  drawer.innerHTML = `
    <button class="close" aria-label="关闭">ESC</button>
    <h2>${esc(m.kind ?? 'memory')} · ${m.pinned ? 'pinned' : esc(m.state)}</h2>
    <div class="meta">${esc(m.memory_id.slice(0, 8))} · ${esc(m.episode_id ?? 'loose')} · ${ageDays(m.created_at)} 天前 · 保留 ${(m.effective_strength * 100).toFixed(1)}%</div>
    <div class="content">${esc(m.content)}</div>
    <div class="scope">${m.content_scope === 'full' ? '全文' : '预览口径（viewer 键）'}${m.content_truncated ? ' · 已截断' : ''}</div>
    <div class="sec">衰减曲线（服务端采样 ±96h）</div>
    <svg id="curve" viewBox="0 0 100 68" preserveAspectRatio="none">
      <line x1="0" y1="${fadeY}" x2="100" y2="${fadeY}" stroke="rgba(150,175,200,.3)" stroke-dasharray="2 2" stroke-width=".5"/>
      ${curveSvg}
    </svg>
    <div class="sec">归因（最近 ${d.attributions.length} 条）</div>
    ${d.attributions.map(a => `<div class="attr">${a.role === 'credited' ? '潮痕 credited' : '侵蚀 blamed'}${a.applied ? '' : `（未应用：${esc(a.reason ?? '')}）`}
      <span class="amt">${a.plasticity ? `${a.plasticity.effective_before} → ${a.plasticity.strength_anchor_after}` : ''}</span>
      ${a.receipt_scores ? `<div class="meta">receipt #${a.receipt_scores.rank} · sim ${a.receipt_scores.similarity} · eff ${a.receipt_scores.effective_strength} · util ${a.receipt_scores.utility} · imp ${a.receipt_scores.importance} · score ${a.receipt_scores.final_score}</div>` : ''}
      <div class="meta">${esc(String(a.reported_at).slice(0, 19))} · ${esc(a.episode_id ?? '')}</div></div>`).join('') || '<div class="meta">尚无 outcome——只被召回过的记忆不会移动</div>'}
    ${d.related.length ? `<div class="sec">关联</div>` + d.related.map(r => `<div class="attr">${r.kind} · ${esc(r.memory_id.slice(0, 8))}</div>`).join('') : ''}
  `
  const newClose = drawer.querySelector('.close')
  newClose.onclick = closeDrawer
  newClose.focus()          // 二审 P1-1a：innerHTML 重写销毁了持焦的旧 close——稳定详情态显式移焦
}
const closeDrawer = () => {
  guard.close()
  drawer.classList.remove('open')
  scrim.classList.remove('show')
  drawer.setAttribute('inert', ''); drawer.setAttribute('aria-hidden', 'true')  // 关闭态移出 Tab/可访问树
  overlay.removeAttribute('inert')                  // 先还按钮可聚焦，再归还焦点
  if (drawerOpener) { drawerOpener.focus(); drawerOpener = null }
}
addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeDrawer(); hideHover() } })

// a11y overlay：按钮与 particle 生命周期同步（P1-5）——新粒子即时得按钮，
// 位置用 transform 在【同一 draw 帧】跟随 presentation pr（不写 layout 属性）
const btnOf = new Map()   // particle -> button
const placeBtn = (b, p) => {
  const [x, y] = anchorXY(p)
  b.style.transform = `translate(${(x - 11).toFixed(1)}px, ${(y - 11).toFixed(1)}px)`
}
// 二审 P1-2：粒子入场收口成一个函数——三条路径（drop 完成/切 reduce flush/初始 reduce 直落）
// 共用，粒子与按钮永远同步
const attachParticle = (p) => {
  particles.push(p)
  if (!REDUCED) motion.grow(p, performance.now())   // 着水生长，消除 attach pop
  addOverlayButton(p)
  live?.clearPending(p.memory_id)
}
const addOverlayButton = (p) => {
  const m = memIndex.get(p.memory_id)
  const b = document.createElement('button')
  b.setAttribute('aria-label', `${LAYER_ZH[p.layer]} 记忆：${(m?.content_preview ?? '').slice(0, 40)}`)
  b.addEventListener('mouseenter', (ev) => hoverIntent(p, [ev.clientX, ev.clientY]))  // 卡出现在鼠标位（Owner 裁定）
  b.addEventListener('mouseleave', hideHover)
  b.addEventListener('focus', () => showHover(p))          // 键盘路径：无坐标，贴粒子 anchor
  b.addEventListener('blur', hideHover)
  b.addEventListener('click', (ev) => openDrawer(p, ev.currentTarget))
  placeBtn(b, p)
  overlay.append(b)
  btnOf.set(p, b)
}
const buildOverlay = () => {
  overlay.innerHTML = ''; btnOf.clear()
  for (const p of particles) addOverlayButton(p)
}
const syncOverlay = (only = null) => { // draw 帧末：only=迁移中粒子（audit #5）；resize/全量走 null
  if (only) { for (const p of only) { const b = btnOf.get(p); if (b) placeBtn(b, p) } return }
  for (const [p, b] of btnOf) placeBtn(b, p)
}
const setThreeVisible = (visible) => document.body.classList.toggle('three-preview', !!visible)
const enableThreePreview = async () => {
  if (!THREE_REQUESTED || threePool) return
  try {
    // Default 2D fallback must not pay the Three.js download/parse cost. The
    // renderer chunk is fetched only for the explicit preview gate.
    const { createTidePool3D, webglAvailable } = await import('/src/pool/three/tide-pool-3d.mjs')
    if (!webglAvailable()) {
      scriptline.textContent = 'WebGL 不可用，已使用签收版 2D 潮池。'
      return
    }
    threePool = createTidePool3D({
      host: stage3d,
      reducedMotion: REDUCED,
      onProjectionFrame: () => syncOverlay(),
      onContextState: (state) => {
        setThreeVisible(state === 'restored')
        if (state === 'lost') scriptline.textContent = 'WebGL context lost，已即时回落 2D 潮池。'
        else scriptline.textContent = '3D Tier 1 preview · 双击水面复位相机'
        draw(performance.now())
      },
    })
    setThreeVisible(true)
    scriptline.textContent = '3D Tier 1 preview · 双击水面复位相机'
  } catch (error) {
    threePool?.dispose()
    threePool = null
    setThreeVisible(false)
    scriptline.textContent = `3D 初始化失败，已使用 2D：${error.message}`
  }
}
let resizeRaf = 0
addEventListener('resize', () => {    // 二审 P1-1b：resize 不重建（重建会把 drawerOpener 变孤儿节点，
  cancelAnimationFrame(resizeRaf)     // 焦点归还失效）——按钮成员只随 particle 生命周期变，位置 rAF 同步
  resizeRaf = requestAnimationFrame(() => syncOverlay())
})

const boot = async () => {
  resize()
  await enableThreePreview()
  const snap = await fetchSnapshot()
  const { memories } = applySnapshot(snap, { initial: true })   // scripted 分支要用（一审 P1-1）
  draw(performance.now())

  // 真实 activity 消费环（DESIGN v2 契约 B 消费规则）：scripted 模式（?script=1）只演语法，
  // live 模式（默认）只认持久化事件——remember 生成粒子 / recall 只涟漪 /
  // applied credited·blamed 潮痕+迁移 / cancelled·late·未 applied 零动作
  if (new URLSearchParams(location.search).get('script') !== '1') startActivityLoop(snap)

  if (new URLSearchParams(location.search).get('script') === '1' && particles.length > 2) {
    // remember 演示走正常 layout target：把 scripted 记忆并入 fixture 重跑 layout，
    // 其 created_at 最新 → 时序 rank 居末 → 既有粒子位置不受扰动（确定性布局保证）
    const scripted = { memory_id: 'ffffffff-ffff-4fff-8fff-ffffffffffff', pinned: false,
      effective_strength: 0.82, created_at: new Date(Date.parse(snap.snapshot_at) + 1000).toISOString() }
    const relaid = layoutPool([...memories, scripted])
    const spawnPlace = relaid.placed.find(p => p.memory_id === scripted.memory_id)

    const seq = [
      ['remember：一滴雨落入潮池，新粒子生成并留下', (t) => {
        if (!spawnPlace) { scriptline.textContent += '（overflow——显式，跳过）'; return }
        const spawn = { ...spawnPlace, pr: spawnPlace.r }
        if (REDUCED) { attachParticle(spawn); requestDraw(); return }   // 初始 reduce 支同样得按钮（二审 P1-2）
        drops.push({ theta: spawnPlace.theta, r: spawnPlace.r, t0: t, spawn })
      }],
      ['recall：只激起涟漪，粒子不移动', (t) => {
        const p = particles[1]
        if (REDUCED) return                                   // reduced：无位移事件无需演
        ripples.push({ theta: p.theta, r: p.pr, t0: t })
      }],
      ['credited (applied)：留下完整潮痕（停留后淡出），向中心迁移', () => {
        const p = particles[1]
        addRing(p, 'credited')                                 // 痕先落，位移随后；痕淡出、半径持久
        migrate(p, Math.max(POOL_CFG.PIN_RING, p.pr - 0.15))
      }],
      ['blamed (applied)：断裂侵蚀痕（停留后淡出），向外迁移', () => {
        const p = particles[2]
        addRing(p, 'blamed')
        migrate(p, Math.min(1 - POOL_CFG.OUTER_INSET, p.pr + 0.15))
      }],
      ['cancelled / late：什么都不发生（无粒子可动）', () => {}],
      ['passive decay：属快照差值，此处不演', () => {}],
    ]
    let i = 0
    const stepSeq = () => {
      if (i >= seq.length) { scriptline.textContent = 'SCRIPTED 序列结束（真实动画只认 /viz/activity）'; requestDraw(); return }   // 走 step→draw，不裸 draw
      const [label, fx] = seq[i++]
      scriptline.textContent = `SCRIPTED ${i}/${seq.length} · ${label}`
      fx(performance.now())
      requestDraw()
      setTimeout(stepSeq, REDUCED ? 1400 : 2200)               // reduced：终态直落，节奏收紧
    }
    stepSeq()
  }
}
// ---- 快照应用与增量迁移：radiusOf 是唯一半径真相，快照差值驱动 migrate（credited 内移/
//      blamed 外移/decay 缓慢外移全部由此表达——动画消费事件，位置消费快照，互不冒充）----
function applySnapshot(snap, { initial = false } = {}) {
  const memories = [...snap.episodes.flatMap(e => e.memories), ...snap.loose]
  for (const m of memories) memIndex.set(m.memory_id, m)
  fadeR = fadeLineRadius(snap.fade_threshold)
  const { placed, overflow } = layoutPool(memories)
  meta.textContent = `${snap.total_memories} memories · ${snap.snapshot_at}` +
    (overflow.length ? ` · overflow ${overflow.length}（显式）` : '') + (snap.capped ? ' · CAPPED' : '') +
    (threePool?.active ? ' · 3D PREVIEW' : '')
  if (initial) {
    particles = placed.map(p => ({ ...p, pr: p.r, pinned: !!memIndex.get(p.memory_id)?.pinned }))
    buildOverlay()
    // 首屏入场（audit 机会 A，仅此一次）：锚定层→潮带→退潮缘错峰，层内按角向扫过——
    // 池子"注满"的 0.9s。纯装饰：按钮已就位，不阻塞任何交互；REDUCED 直落终态。
    if (!REDUCED && particles.length) {
      const layerIdx = { anchor: 0, active_tide: 1, receding_edge: 2 }
      const t0 = performance.now()
      for (const p of particles) {
        const sweep = ((p.theta % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) / (2 * Math.PI)
        motion.enter(p, t0 + (layerIdx[p.layer] ?? 2) * MOTION.ENTRANCE_LAYER_MS + sweep * MOTION.ENTRANCE_SWEEP_MS)
      }
      requestDraw()
    }
    return { memories, added: [], removed: [] }
  }
  // 增量：已有粒子 → 目标半径变了就 migrate（可中断 settle）；新增/移除由 diffSnapshot
  // 纯函数裁决（pending 记账：落滴在途不重复生成也不误删——L7 集成判别）
  const byId = new Map(particles.map(p => [p.memory_id, p]))
  for (const np of placed) {
    const old = byId.get(np.memory_id)
    if (old) {
      old.s = np.s; old.layer = np.layer; old.markR = np.markR
      old.pinned = !!memIndex.get(np.memory_id)?.pinned
      motion.thetaUpdate(old, np.theta)   // theta-only relayout 也标 dirty（一审 P1-1 反例③）
      if (Math.abs(np.r - old.r) > 1e-6) { old.r = np.r; migrate(old, np.r) }
    }
  }
  const isPending = (id) => !!(live && live.isPending(id))
  const d = diffSnapshot(placed.map(p => p.memory_id), particles.map(p => p.memory_id), isPending)
  const placedById = new Map(placed.map(p => [p.memory_id, p]))
  const added = d.added.map(id => placedById.get(id))
  const removedSet = new Set(d.removedIds)
  for (const p of particles) if (removedSet.has(p.memory_id)) { btnOf.get(p)?.remove(); btnOf.delete(p) }
  particles = particles.filter(p => !removedSet.has(p.memory_id))
  return { memories, added, removed: d.removedIds }
}

// ---- activity 消费环：协调器承担全部状态语义（bootstrap head/持久边界/单飞/续排/
//      快照单调门/pendingSpawn）——见 live-coordinator.mjs 与 test-live-coordinator L1-L7 ----
let live = null
const sessionStore = {
  get: (k) => { try { return sessionStorage.getItem(k) } catch { return null } },
  set: (k, v) => { try { sessionStorage.setItem(k, v) } catch {} },
}
let refreshTimer = null
const scheduleSnapshotRefresh = (delay = 1500) => {
  clearTimeout(refreshTimer)
  refreshTimer = setTimeout(() => live?.refreshSnapshot(), delay)
}
function startActivityLoop(bootSnap) {
  live = makeLiveCoordinator({
    storage: sessionStore,
    fetchActivity: async ({ head, after } = {}) => {
      const q = new URLSearchParams()
      if (head) q.set('head', '1')
      if (after) q.set('after', after)
      try {
        const res = await fetch(`/viz/activity?${q}`, { signal: AbortSignal.timeout(20000) })
        return await res.json()
      } catch { return null }
    },
    fetchSnapshot: async () => {
      try {
        const res = await fetch('/viz/ocean', { signal: AbortSignal.timeout(20000) })
        return await res.json()
      } catch { return null }
    },
    onEvent: (e) => {
      if (e.kind === 'recall') {
        // recall 只涟漪不移动（契约）；REDUCED 下零位移动画——与 scripted 同一 gate（三审 P1-2）。
        // 涟漪打在被召回的粒子上（事件 memory_ids=injected receipt items，与 scripted 同语法）；
        // 无一命中（overflow/已移除）时回退池心，recall 仍可见
        if (!REDUCED) {
          const now = performance.now()
          const targets = (e.memory_ids ?? [])
            .map(id => particles.find(p => p.memory_id === id)).filter(Boolean).slice(0, 6)
          if (targets.length) for (const p of targets)
            ripples.push({ theta: p.theta, r: p.pr, t0: now, small: targets.length > 2 })
          else ripples.push({ theta: 0, r: 0, t0: now })
          requestDraw()
        }
      } else if (e.kind === 'outcome') {
        for (const act of outcomeActions(e)) {          // 零动作规则集中在纯函数（L6）
          const p = particles.find(x => x.memory_id === act.memory_id)
          if (p) addRing(p, act.role)
        }
        if (outcomeActions(e).length) requestDraw()
      }
      // cancelled/late/未 applied：连快照 fetch 都不触发（二审 P1-5，eventCausesRefresh 集中裁决）
      if (eventCausesRefresh(e)) scheduleSnapshotRefresh()
    },
    onSnapshot: (snap) => {
      const { added } = applySnapshot(snap)
      for (const np of added) {                          // remember：落滴后粒子留存
        const spawn = { ...np, pr: np.r, pinned: !!memIndex.get(np.memory_id)?.pinned }
        live.markPending(np.memory_id)                   // 在途记账：相邻快照不重复生成
        if (REDUCED) { attachParticle(spawn); live.clearPending(np.memory_id); continue }
        drops.push({ theta: np.theta, r: np.r, t0: performance.now(), spawn })
      }
      requestDraw()
    },
  })
  // 降级状态常驻上屏（四审 P1-3：显式降级口径，不称 no-loss）
  // retrying 是暂态（恢复后清除）；degraded/halted 常驻（persist=true 不被后续覆盖）
  let liveNote = null, livePersist = false
  const renderLiveNote = (text, persistent = false) => {
    if (livePersist) return
    if (!liveNote) { liveNote = document.createElement('span'); meta.append(liveNote) }
    liveNote.textContent = text ? ` · ${text}` : ''
    livePersist = persistent
  }
  const liveStatus = (v) => {
    if (v === 'error' || String(v).startsWith('not-ready')) renderLiveNote('live 流重连中')
    else if (v === 'recovered-degraded') renderLiveNote('live 流曾降级：间隙事件仅位置更新、无动效标记', true)
    else if (v === 'halted-overloaded') renderLiveNote('live 流过载停止（避免错误重演），刷新页面恢复', true)
    else renderLiveNote('')                              // done/baseline*：清除暂态提示
  }
  ;(async () => {
    liveStatus(await live.bootstrap(bootSnap))           // 复用 boot 快照：同一可见性边界（B1）
    liveStatus(await live.poll())
  })()
  setInterval(async () => liveStatus(await live.poll()), 5000)   // 单飞 + 自愈（L3/B5），interval 只是节拍
  setInterval(() => live.refreshSnapshot(), 60000)       // 周期兜底：decay 缓慢外移来自快照差值
}

boot().catch(showRetry)
</script>
</body>
</html>
